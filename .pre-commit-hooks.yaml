# Lets other repositories run workflow-guard with pre-commit (https://pre-commit.com):
#
#   repos:
#     - repo: https://github.com/Gallileee/workflow-guard
#       rev: v0.4.0
#       hooks:
#         - id: workflow-guard
#
# pre-commit passes the changed workflow and action files as arguments.
- id: workflow-guard
  name: workflow-guard
  description: Find common security mistakes in GitHub Actions workflows
  entry: workflow-guard
  language: python
  # Workflows, an action at the repository root, and local actions in .github/actions/.
  files: ^(\.github/workflows/[^/]+|action|\.github/actions/.+/action)\.ya?ml$
