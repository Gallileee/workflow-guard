name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Dogfooding: this repository's own workflows must pass its own checks.
      - run: workflow-guard

  # Runs action.yml the way other repositories would (uses: ./ is this commit's action.yml).
  action:
    name: action (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: This repository's workflows pass
        uses: ./
      - name: The unsafe fixture fails the step
        id: unsafe
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/unsafe-workflow.yml
          format: json
          output: findings.json
      - name: Ignored rules and fail-on high let it pass
        uses: ./
        with:
          paths: tests/fixtures/unsafe-workflow.yml
          ignore: WG004
          fail-on: high
          format: text
      - name: A custom action passes without script-inputs
        uses: ./
        with:
          paths: tests/fixtures/custom-script-input.yml
      - name: With script-inputs its commands input is checked
        id: custom
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/custom-script-input.yml
          script-inputs: |
            other-org/tool:run
            my-org/deploy:commands
          format: json
          output: custom.json
      - name: Check the results
        shell: bash
        env:
          OUTCOME: ${{ steps.unsafe.outcome }}
          CUSTOM: ${{ steps.custom.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q '"rule": "WG004"' findings.json
          test "$CUSTOM" = failure
          grep -q "my-org/deploy runs its 'commands' input as a script" custom.json

  # Uploads this repository's own results to GitHub code scanning (Security tab, PR annotations).
  code-scanning:
    # Pull requests from forks get a read-only token, so the upload would fail there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install .
      # --fail-on high: low/medium findings go to code scanning instead of failing the job;
      # the test job above already fails on any finding.
      - run: workflow-guard --format sarif --output results.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        if: always()
        with:
          sarif_file: results.sarif
          category: workflow-guard
